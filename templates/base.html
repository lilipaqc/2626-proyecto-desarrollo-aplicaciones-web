<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="AdoptaYA! - Plataforma web para la adopción responsable de animales">
        <meta name="keywords" content="adopción, animales, mascotas, donaciones, Ecuador">
        <title>AdoptaYA! - {% block titulo %}Inicio{% endblock %}</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>

        <!-- header -->
        <header>
            <h1>AdoptaYA!</h1>
            <p>Plataforma web para la adopción responsable de animales y gestión de donaciones para su bienestar</p>
        </header>

        <!-- barra de navegación, componente reutilizable -->
        {% include "components/navbar.html" %}

        <!-- contenido principal, cambia segun la pagina que herede de base.html -->
        <main>
            {% block content %}{% endblock %}
        </main>

        <!-- footer, componente reutilizable -->
        {% include "components/footer.html" %}

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- bloque para scripts propios de cada pagina, no todas las paginas necesitan script.js -->
        {% block scripts %}{% endblock %}
    </body>
</html>
